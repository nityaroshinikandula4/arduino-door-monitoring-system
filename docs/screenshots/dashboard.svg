<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="t d"><title id="t">DoorSense real-time monitoring dashboard</title><desc id="d">Dark operations dashboard showing a closed door, live distance telemetry, event history, and simulator controls.</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#3c75ff"/><stop offset="1" stop-color="#20d0a0"/></linearGradient></defs><rect width="1200" height="760" rx="28" fill="#10151c"/><rect x="28" y="24" width="1144" height="62" rx="18" fill="#171e28" stroke="#27313e"/><rect x="52" y="38" width="36" height="36" rx="11" fill="url(#g)"/><text x="101" y="64" fill="#eef5ff" font-family="Arial,sans-serif" font-size="22" font-weight="700">DoorSense</text><circle cx="991" cy="55" r="6" fill="#20d0a0"/><text x="1006" y="60" fill="#8290a3" font-family="Arial,sans-serif" font-size="12">SIMULATOR CONNECTED</text><rect x="48" y="112" width="704" height="316" rx="24" fill="#171e28" stroke="#27313e"/><text x="78" y="154" fill="#8290a3" font-family="Arial,sans-serif" font-size="12" letter-spacing="2">LIVE DOOR STATUS</text><text x="78" y="208" fill="#eef5ff" font-family="Arial,sans-serif" font-size="44" font-weight="700">Closed and secure.</text><text x="78" y="239" fill="#8d99aa" font-family="Arial,sans-serif" font-size="14">Hysteresis reduces sensor noise and state flapping.</text><rect x="78" y="282" width="212" height="112" rx="19" fill="#111821"/><text x="98" y="319" fill="#7e8c9f" font-family="Arial,sans-serif" font-size="11">DISTANCE</text><text x="98" y="363" fill="#eef5ff" font-family="Arial,sans-serif" font-size="34" font-weight="700">7.8 <tspan font-size="15" fill="#8d99aa">cm</tspan></text><rect x="310" y="282" width="190" height="112" rx="19" fill="#111821"/><text x="330" y="319" fill="#7e8c9f" font-family="Arial,sans-serif" font-size="11">STATE</text><text x="330" y="363" fill="#20d0a0" font-family="Arial,sans-serif" font-size="25" font-weight="700">CLOSED</text><rect x="520" y="282" width="202" height="112" rx="19" fill="#111821"/><text x="540" y="319" fill="#7e8c9f" font-family="Arial,sans-serif" font-size="11">UPTIME</text><text x="540" y="363" fill="#eef5ff" font-family="Arial,sans-serif" font-size="25" font-weight="700">02:14:37</text><rect x="780" y="112" width="372" height="316" rx="24" fill="#171e28" stroke="#27313e"/><text x="810" y="154" fill="#8290a3" font-family="Arial,sans-serif" font-size="12" letter-spacing="2">SIMULATOR</text><text x="810" y="194" fill="#eef5ff" font-family="Arial,sans-serif" font-size="25" font-weight="700">Test the state engine</text><rect x="810" y="232" width="312" height="54" rx="27" fill="url(#g)"/><text x="913" y="266" fill="#07121a" font-family="Arial,sans-serif" font-size="15" font-weight="700">Open door</text><rect x="810" y="302" width="312" height="54" rx="27" fill="#232d3a"/><text x="907" y="336" fill="#d4deeb" font-family="Arial,sans-serif" font-size="15" font-weight="700">Close door</text><text x="810" y="391" fill="#748296" font-family="Arial,sans-serif" font-size="11">State-changing requests require an API key.</text><rect x="48" y="456" width="1104" height="256" rx="24" fill="#171e28" stroke="#27313e"/><text x="78" y="499" fill="#8290a3" font-family="Arial,sans-serif" font-size="12" letter-spacing="2">RECENT EVENTS</text><g font-family="Arial,sans-serif" font-size="13"><text x="78" y="548" fill="#eef5ff">Door closed</text><text x="450" y="548" fill="#8d99aa">Distance returned below close threshold</text><text x="1035" y="548" fill="#748296">12:42:18</text><line x1="78" y1="568" x2="1122" y2="568" stroke="#27313e"/><text x="78" y="611" fill="#eef5ff">Door opened</text><text x="450" y="611" fill="#8d99aa">Distance exceeded open threshold</text><text x="1035" y="611" fill="#748296">12:41:54</text><line x1="78" y1="631" x2="1122" y2="631" stroke="#27313e"/><text x="78" y="674" fill="#eef5ff">Monitor online</text><text x="450" y="674" fill="#8d99aa">Web